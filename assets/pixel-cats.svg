<svg xmlns="http://www.w3.org/2000/svg" width="64" height="36" viewBox="0 0 64 36" shape-rendering="crispEdges">
  <title>Hongchen Wei - a tabby cat and a little black cat</title>
  <style>
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      #tabby-actor { animation: tabby-approach 16s step-end infinite; }
      #black-actor { animation: black-approach 16s step-end infinite; }
      #tabby-eyes { animation: tabby-open 16s step-end infinite; }
      #tabby-eyes-closed { animation: tabby-closed 16s step-end infinite; }
      #black-eyes { animation: black-open 16s step-end infinite; }
      #black-eyes-closed { animation: black-closed 16s step-end infinite; }
      #tabby-tail { animation: tabby-tail-flick 16s step-end infinite; }
      #black-tail { animation: black-tail-flick 16s step-end infinite; }
      #shared-heart { animation: shared-heart 16s step-end infinite; }
      #tabby-actor, #black-actor, #tabby-eyes, #tabby-eyes-closed,
      #black-eyes, #black-eyes-closed, #tabby-tail, #black-tail, #shared-heart {
        animation-delay: -8s;
      }
      @keyframes tabby-approach {
        0%, 78%, 100% { transform: translateX(0); }
        65%, 76% { transform: translateX(2px); }
        67% { transform: translateX(4px); }
      }
      @keyframes black-approach {
        0%, 78%, 100% { transform: translateX(0); }
        65%, 76% { transform: translateX(-2px); }
        67% { transform: translateX(-4px); }
      }
      @keyframes tabby-open {
        0%, 21%, 75%, 100% { opacity: 1; }
        20%, 68% { opacity: 0; }
      }
      @keyframes tabby-closed {
        0%, 21%, 75%, 100% { opacity: 0; }
        20%, 68% { opacity: 1; }
      }
      @keyframes black-open {
        0%, 29%, 75%, 100% { opacity: 1; }
        28%, 68% { opacity: 0; }
      }
      @keyframes black-closed {
        0%, 29%, 75%, 100% { opacity: 0; }
        28%, 68% { opacity: 1; }
      }
      @keyframes tabby-tail-flick {
        0%, 22%, 100% { transform: translate(0, 0); }
        18% { transform: translate(-2px, 0); }
      }
      @keyframes black-tail-flick {
        0%, 82%, 86%, 100% { transform: translate(0, 0); }
        80%, 84% { transform: translate(-2px, 0); }
      }
      @keyframes shared-heart {
        0%, 75%, 100% { opacity: 0; }
        69% { opacity: 1; }
      }
    }
</style>
  <g>
    <g id="tabby-actor">
      <g transform="translate(32 4) scale(-1 1)">
        <rect x="4" y="28" width="26" height="2" fill="#e4e9e6" />
        <g id="tabby-tail">
          <g fill="#514c45">
            <rect x="22" y="24" width="6" height="4" />
            <rect x="26" y="16" width="4" height="10" />
            <rect x="28" y="12" width="2" height="6" />
          </g>
          <g fill="#a29b8e">
            <rect x="24" y="24" width="4" height="2" />
            <rect x="28" y="18" width="2" height="6" />
          </g>
          <rect x="28" y="20" width="2" height="2" fill="#665f55" />
          <rect x="24" y="24" width="2" height="2" fill="#665f55" />
        </g>
        <g fill="#514c45">
          <rect x="8" y="18" width="16" height="10" />
          <rect x="6" y="24" width="18" height="4" />
        </g>
        <g fill="#a29b8e">
          <rect x="10" y="20" width="12" height="6" />
          <rect x="8" y="24" width="4" height="2" />
        </g>
        <g fill="#f0eee5">
          <rect x="12" y="20" width="6" height="6" />
          <rect x="8" y="26" width="6" height="2" />
          <rect x="18" y="26" width="4" height="2" />
        </g>
        <g fill="#514c45">
          <rect x="4" y="4" width="4" height="8" />
          <rect x="20" y="4" width="4" height="8" />
          <rect x="6" y="8" width="16" height="12" />
          <rect x="4" y="10" width="20" height="8" />
          <rect x="8" y="18" width="12" height="4" />
        </g>
        <g fill="#a29b8e">
          <rect x="6" y="6" width="2" height="6" />
          <rect x="20" y="6" width="2" height="6" />
          <rect x="8" y="10" width="12" height="2" />
          <rect x="6" y="12" width="16" height="6" />
        </g>
        <g fill="#f0eee5">
          <rect x="10" y="12" width="8" height="8" />
          <rect x="8" y="16" width="12" height="2" />
        </g>
        <g fill="#c79b92">
          <rect x="6" y="8" width="2" height="2" />
          <rect x="20" y="8" width="2" height="2" />
        </g>
        <g id="tabby-eyes" fill="#34392d">
          <rect x="8" y="12" width="2" height="4" />
          <rect x="18" y="12" width="2" height="4" />
        </g>
        <g id="tabby-eyes-closed" fill="#34392d" opacity="0">
          <rect x="8" y="14" width="2" height="2" />
          <rect x="18" y="14" width="2" height="2" />
        </g>
        <rect x="13" y="16" width="2" height="2" fill="#9e7774" />
        <g fill="#1769ae">
          <rect x="10" y="20" width="10" height="2" />
          <rect x="18" y="22" width="2" height="2" />
        </g>
        <g id="tabby-stripes">
          <rect x="10" y="10" width="2" height="2" fill="#665f55" />
          <rect x="14" y="10" width="2" height="4" fill="#665f55" />
          <rect x="18" y="10" width="2" height="2" fill="#665f55" />
          <rect x="6" y="14" width="2" height="2" fill="#665f55" />
          <rect x="20" y="14" width="2" height="2" fill="#665f55" />
          <rect x="10" y="22" width="2" height="2" fill="#665f55" />
          <rect x="20" y="22" width="2" height="2" fill="#665f55" />
          <rect x="8" y="24" width="4" height="2" fill="#665f55" />
        </g>
      </g>
    </g>
    <g id="black-actor">
      <g transform="translate(32 4)">
        <rect x="4" y="28" width="26" height="2" fill="#e4e9e6" />
        <g id="black-tail">
          <g fill="#191c22">
            <rect x="22" y="24" width="6" height="4" />
            <rect x="26" y="16" width="4" height="10" />
            <rect x="28" y="12" width="2" height="6" />
          </g>
          <g fill="#343943">
            <rect x="24" y="24" width="4" height="2" />
            <rect x="28" y="18" width="2" height="6" />
          </g>
        </g>
        <g fill="#191c22">
          <rect x="8" y="18" width="16" height="10" />
          <rect x="6" y="24" width="18" height="4" />
        </g>
        <g fill="#343943">
          <rect x="10" y="20" width="12" height="6" />
          <rect x="8" y="24" width="4" height="2" />
        </g>
        <g fill="#282d36">
          <rect x="12" y="20" width="6" height="6" />
          <rect x="8" y="26" width="6" height="2" />
          <rect x="18" y="26" width="4" height="2" />
        </g>
        <g fill="#191c22">
          <rect x="4" y="4" width="4" height="8" />
          <rect x="20" y="4" width="4" height="8" />
          <rect x="6" y="8" width="16" height="12" />
          <rect x="4" y="10" width="20" height="8" />
          <rect x="8" y="18" width="12" height="4" />
        </g>
        <g fill="#343943">
          <rect x="6" y="6" width="2" height="6" />
          <rect x="20" y="6" width="2" height="6" />
          <rect x="8" y="10" width="12" height="2" />
          <rect x="6" y="12" width="16" height="6" />
        </g>
        <g fill="#282d36">
          <rect x="10" y="12" width="8" height="8" />
          <rect x="8" y="16" width="12" height="2" />
        </g>
        <g fill="#6b5b6c">
          <rect x="6" y="8" width="2" height="2" />
          <rect x="20" y="8" width="2" height="2" />
        </g>
        <g id="black-eyes" fill="#d8bd75">
          <rect x="8" y="12" width="2" height="4" />
          <rect x="18" y="12" width="2" height="4" />
        </g>
        <g id="black-eyes-closed" fill="#d8bd75" opacity="0">
          <rect x="8" y="14" width="2" height="2" />
          <rect x="18" y="14" width="2" height="2" />
        </g>
        <rect x="13" y="16" width="2" height="2" fill="#bb858a" />
        <g fill="#535f70">
          <rect x="10" y="20" width="10" height="2" />
          <rect x="18" y="22" width="2" height="2" />
        </g>
      </g>
    </g>
  </g>
  <g id="shared-heart" opacity="0">
    <rect x="29" y="0" width="2" height="1" fill="#b97872" />
    <rect x="33" y="0" width="2" height="1" fill="#b97872" />
    <rect x="28" y="1" width="8" height="2" fill="#b97872" />
    <rect x="29" y="3" width="6" height="1" fill="#b97872" />
    <rect x="30" y="4" width="4" height="1" fill="#b97872" />
    <rect x="31" y="5" width="2" height="1" fill="#b97872" />
  </g>
</svg>
